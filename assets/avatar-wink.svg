<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 12 140 144" width="100%" height="100%">
  <!-- Head & Ears (Pure Black Outlines, 100% Transparent Background Fill) -->
  <g id="head">
    <path d="M 46 88 C 46 150, 154 150, 154 88" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Ear -->
    <path d="M 46 86 C 30 86, 30 114, 46 114" fill="none" stroke="#000000" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 41 96 C 37 96, 37 104, 42 104" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Right Ear -->
    <path d="M 154 86 C 170 86, 170 114, 154 114" fill="none" stroke="#000000" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 159 96 C 164 96, 164 104, 158 104" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Black Hair -->
  <path d="M 38 90 C 30 45, 52 14, 100 14 C 150 14, 172 45, 164 90 C 158 76, 150 68, 145 54 C 130 68, 114 70, 102 82 C 90 68, 76 64, 60 78 C 52 68, 42 74, 38 90 Z" fill="#000000"/>

  <!-- Eyebrows -->
  <path d="M 64 78 C 74 72, 84 75, 90 79" fill="none" stroke="#000000" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 112 79 C 118 75, 128 72, 138 78" fill="none" stroke="#000000" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Glasses Frame -->
  <rect x="46" y="86" width="46" height="36" rx="12" fill="none" stroke="#000000" stroke-width="6.5"/>
  <rect x="108" y="86" width="46" height="36" rx="12" fill="none" stroke="#000000" stroke-width="6.5"/>
  <!-- Glasses Bridge -->
  <path d="M 92 97 L 108 97" stroke="#000000" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Temples -->
  <path d="M 36 96 L 46 96" stroke="#000000" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 154 96 L 164 96" stroke="#000000" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Eyes (Wink: Left Dot, Right '<') -->
  <circle cx="69" cy="104" r="5" fill="#000000"/>
  <path d="M 137 98 L 125 104 L 137 110" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Smile -->
  <path d="M 86 136 Q 100 141 114 136" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
</svg>
