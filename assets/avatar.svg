<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="160" height="160">
  <!-- Circle head outline -->
  <path d="M 50 85 C 50 45, 150 45, 150 85 C 150 145, 50 145, 50 85 Z" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Black Hair -->
  <path d="M 45 80 C 45 40, 70 25, 100 25 C 130 25, 155 40, 155 80 C 155 60, 140 40, 100 40 C 60 40, 45 60, 45 80 Z" fill="#000000"/>
  <path d="M 55 75 C 65 50, 95 45, 100 55 C 105 45, 135 50, 145 75 C 135 60, 115 55, 100 62 C 85 55, 65 60, 55 75 Z" fill="#000000"/>

  <!-- Glasses -->
  <!-- Left Lens -->
  <rect x="62" y="75" width="32" height="30" rx="10" fill="none" stroke="#000000" stroke-width="4.5"/>
  <!-- Right Lens -->
  <rect x="106" y="75" width="32" height="30" rx="10" fill="none" stroke="#000000" stroke-width="4.5"/>
  <!-- Bridge -->
  <line x1="94" y1="88" x2="106" y2="88" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Temples -->
  <line x1="50" y1="85" x2="62" y2="85" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="138" y1="85" x2="150" y2="85" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="78" cy="90" r="3.5" fill="#000000"/>
  <circle cx="122" cy="90" r="3.5" fill="#000000"/>

  <!-- Nose -->
  <path d="M 100 95 L 98 105 L 102 105" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mouth -->
  <path d="M 90 120 Q 100 125 110 120" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
