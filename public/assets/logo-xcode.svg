<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="xcode-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#30b8ff"/>
      <stop offset="50%" stop-color="#1480f0"/>
      <stop offset="100%" stop-color="#0555d4"/>
    </linearGradient>
    <linearGradient id="hammer-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55555e"/>
      <stop offset="50%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#111115"/>
    </linearGradient>
  </defs>

  <!-- Blue Squircle Background with Grid Texture -->
  <rect width="100" height="100" rx="22" fill="url(#xcode-bg)"/>
  
  <!-- Blueprint Grid Overlay -->
  <path d="M 0 25 H 100 M 0 50 H 100 M 0 75 H 100 M 25 0 V 100 M 50 0 V 100 M 75 0 V 100" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.2"/>

  <!-- 3D Xcode Metallic Hammer -->
  <g transform="rotate(-38 50 50)">
    <!-- Hammer Handle -->
    <rect x="44" y="32" width="12" height="48" rx="4" fill="url(#hammer-metal)"/>
    <!-- Rubber Grip Lines -->
    <line x1="44" y1="68" x2="56" y2="68" stroke="#1a1a20" stroke-width="2"/>
    <line x1="44" y1="73" x2="56" y2="73" stroke="#1a1a20" stroke-width="2"/>
    <!-- Hammer Head -->
    <path d="M 28 22 C 28 20, 68 18, 74 24 C 74 30, 62 34, 52 34 L 40 34 C 32 34, 28 28, 28 22 Z" fill="url(#hammer-metal)"/>
    <!-- Claw -->
    <path d="M 66 22 Q 78 16 82 28 Q 74 30 66 26 Z" fill="#3a3a42"/>
  </g>
</svg>
