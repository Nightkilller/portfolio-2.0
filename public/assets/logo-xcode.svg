<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Xcode App Icon Gradient -->
    <linearGradient id="xcode-bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38c3ff"/>
      <stop offset="45%" stop-color="#148eff"/>
      <stop offset="100%" stop-color="#0066eb"/>
    </linearGradient>
    
    <!-- Metallic Hammer Head Gradient -->
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#666675"/>
      <stop offset="35%" stop-color="#33333d"/>
      <stop offset="70%" stop-color="#1b1b22"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>

    <!-- Handle Rubber Grip Texture -->
    <linearGradient id="handle-grip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#111115"/>
    </linearGradient>
  </defs>

  <!-- Xcode Blueprint Squircle Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#xcode-bg-gradient)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <path d="
    M 0 128 H 512 M 0 256 H 512 M 0 384 H 512 
    M 128 0 V 512 M 256 0 V 512 M 384 0 V 512" 
    stroke="#ffffff" stroke-opacity="0.18" stroke-width="5"/>

  <!-- 3D Xcode Hammer (Angled at -40 deg) -->
  <g transform="rotate(-40 256 256)">
    <!-- Hammer Grip Handle -->
    <rect x="232" y="160" width="48" height="240" rx="20" fill="url(#handle-grip)"/>
    <rect x="232" y="160" width="48" height="240" rx="20" stroke="#000000" stroke-opacity="0.4" stroke-width="4" fill="none"/>
    
    <!-- Rubber Ridges on Handle -->
    <line x1="232" y1="320" x2="280" y2="320" stroke="#08080a" stroke-width="8"/>
    <line x1="232" y1="345" x2="280" y2="345" stroke="#08080a" stroke-width="8"/>
    <line x1="232" y1="370" x2="280" y2="370" stroke="#08080a" stroke-width="8"/>

    <!-- Hammer Head (Solid Heavy Metal) -->
    <path d="M 120 100 C 120 90, 360 80, 380 110 C 380 140, 320 160, 280 160 L 200 160 C 150 160, 120 130, 120 100 Z" fill="url(#metal-shine)"/>
    
    <!-- Claw Extension -->
    <path d="M 340 105 Q 410 70 430 130 Q 380 140, 340 120 Z" fill="#24242c"/>
    <path d="M 120 100 Q 110 95 100 105 Q 110 115 120 110 Z" fill="#777788"/>
  </g>
</svg>
